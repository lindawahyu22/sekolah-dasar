<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard Admin - SD 1 Air Abang</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
:root {
  --primary: #0f3e7f;
  --primary-light: #1e40af;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --text: #1e293b;
  --text-light: #475569;
  --bg: #e7f0ff;
  --white: #ffffff;
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.12);
  --radius: 14px;
  --danger: #ef4444;
  --success: #22c55e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
}
h1, h2, h3, h4 { color: var(--primary); }

.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* HEADER */
header {
  background: var(--primary);
  color: var(--white);
  padding: 15px 0;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 100;
}
.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.logo i { color: var(--accent); }
.btn-logout {
  background: var(--danger);
  color: var(--white);
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}
.btn-logout:hover { background: #dc2626; }

/* SIDEBAR & MAIN */
.main-container {
  display: flex;
  padding-top: 80px;
  min-height: 100vh;
}
.sidebar {
  width: 250px;
  background: var(--white);
  padding: 20px;
  border-right: 1px solid #e2e8f0;
  position: fixed;
  height: 100%;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: 0.3s;
  margin-bottom: 8px;
  font-weight: 500;
}
.menu-item:hover, .menu-item.active {
  background: var(--accent);
  color: var(--white);
}
.menu-item i { width: 20px; }

.content {
  flex: 1;
  margin-left: 250px;
  padding: 30px;
}

/* CARDS & TABLES */
.card {
  background: var(--white);
  padding: 25px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 25px;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s;
}
.btn-primary { background: var(--accent); color: var(--white); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--danger); color: var(--white); }
.btn-success { background: var(--success); color: var(--white); }
.btn-outline { background: transparent; border: 2px solid var(--white); color: var(--white); }
.btn-outline:hover { background: rgba(255,255,255,0.08); }
.btn-sm { padding: 6px 12px; font-size: 0.85rem; }

.data-table {
  width: 100%;
  border-collapse: collapse;
}
.data-table th, .data-table td {
  padding: 12px 15px;
  text-align: left;
  border-bottom: 1px solid #e2e8f0;
}
.data-table th {
  background: #f8fafc;
  font-weight: 600;
}
.data-table tr:hover { background: #f8fafc; }

/* FORMS */
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
.form-control {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
}
.form-control:focus { outline: none; border-color: var(--accent); }
textarea.form-control { resize: vertical; min-height: 100px; }

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--white);
  padding: 30px;
  border-radius: var(--radius);
  max-width: 600px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.close-btn {
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--text-light);
}

/* GALLERY GRID */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}
.gallery-item {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  aspect-ratio: 1;
}
.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.gallery-actions {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  transition: 0.3s;
}
.gallery-item:hover .gallery-actions { opacity: 1; }

/* TABS */
.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn {
  padding: 10px 20px;
  border: none;
  background: #e2e8f0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}
.tab-btn.active { background: var(--primary); color: var(--white); }

/* MESSAGE */
.alert {
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
}
.alert-success { background: #dcfce7; color: #166534; }
.alert-error { background: #fee2e2; color: #991b1b; }

@media(max-width: 1024px) {
  .main-container { flex-direction: column; }
  .sidebar {
    position: relative;
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 20px;
  }
  .menu-item { flex: 1 1 calc(50% - 10px); }
  .content { margin-left: 0; padding: 20px; }
}
@media(max-width: 640px) {
  .menu-item { flex: 1 1 100%; }
  .header-content { flex-direction: column; gap: 15px; align-items: flex-start; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="container header-content">
    <div class="logo"><i class="fas fa-school"></i> SD 1 Air Abang <span style="color:var(--accent);">Admin</span></div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
      <button class="btn btn-outline" id="btnHome"><i class="fas fa-arrow-left"></i> Beranda</button>
      <button class="btn-logout" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>
</header>

<div class="main-container">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="menu-item active" data-page="dashboard" onclick="navigateToPage('dashboard')"><i class="fas fa-home"></i> Dashboard</div>
    <div class="menu-item" data-page="berita" onclick="navigateToPage('berita')"><i class="fas fa-newspaper"></i> Kelola Berita</div>
    <div class="menu-item" data-page="galeri" onclick="navigateToPage('galeri')"><i class="fas fa-images"></i> Kelola Galeri</div>
    <div class="menu-item" data-page="guru" onclick="navigateToPage('guru')"><i class="fas fa-chalkboard-teacher"></i> Kelola Guru</div>
    <div class="menu-item" data-page="fasilitas" onclick="navigateToPage('fasilitas')"><i class="fas fa-building"></i> Kelola Fasilitas</div>
    <div class="menu-item" data-page="statistik" onclick="navigateToPage('statistik')"><i class="fas fa-chart-bar"></i> Statistik</div>
    <div class="menu-item" data-page="peserta" onclick="navigateToPage('peserta')"><i class="fas fa-users"></i> Data Pendaftaran</div>
    <div class="menu-item" data-page="pesan" onclick="navigateToPage('pesan')"><i class="fas fa-envelope"></i> Pesan Masuk</div>
    <div class="menu-item" onclick="window.location.href='index.html'"><i class="fas fa-globe"></i> Lihat Website</div>
  </nav>

  <!-- CONTENT AREA -->
  <main class="content" id="mainContent">
    <!-- Konten akan dimuat di sini via JS -->
  </main>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Title</h3>
      <span class="close-btn" id="closeModal">&times;</span>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// Inisialisasi Data
function loadStoredData(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  } catch (err) {
    console.warn(`localStorage parse error for ${key}:`, err);
    localStorage.removeItem(key);
    return fallback;
  }
}

let berita = loadStoredData('berita', [
  { id: 1, title: 'Juara Lomba Senam Geral', date: '15 Jan 2024', desc: 'Siswa SD 1 Air Abang berhasil menjuarai lomba senam geral tingkat kecamatan.', img: 'https://images.unsplash.com/photo-1571260899304-425eee4c7efd?auto=format&fit=crop&w=400&q=80' },
  { id: 2, title: 'Perpisahan Kelas 6', date: '10 Jan 2024', desc: 'Perpisahan siswa kelas 6 tahun ajaran 2023/2024 berlangsung haru.', img: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=400&q=80' },
  { id: 3, title: 'Study Tour Jakarta', date: '05 Jan 2024', desc: 'Siswa melakukan study tour ke Museum Nasional dan Taman Mini.', img: 'https://images.unsplash.com/photo-1569025740933-007a13b2a979?auto=format&fit=crop&w=400&q=80' }
]);

let galeri = loadStoredData('galeri', [
  'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=400&q=80',
  'https://images.unsplash.com/photo-1580582932707-520aed75769d?auto=format&fit=crop&w=400&q=80',
  'https://images.unsplash.com/photo-1497633762265-9d179a990a7f?auto=format&fit=crop&w=400&q=80',
  'https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=400&q=80'
]);

let guru = loadStoredData('guru', [
  { id: 1, nama: 'Budi Santoso', mapel: 'Matematika', desc: 'Guru Matematika berpengalaman 10 tahun', img: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=400&q=80' },
  { id: 2, nama: 'Siti Nurhaliza', mapel: 'Bahasa Indonesia', desc: 'Guru Bahasa yang kreatif dan inovatif', img: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80' },
  { id: 3, nama: 'Agus Wijaya', mapel: 'IPA', desc: 'Guru IPA dengan metode pembelajaran interaktif', img: 'https://images.unsplash.com/photo-1529070538774-1843cb3265df?auto=format&fit=crop&w=400&q=80' }
]);

let fasilitas = loadStoredData('fasilitas', [
  { id: 1, nama: 'Laboratorium Komputer', desc: 'Ruang komputer dengan 30 unit komputer modern', img: 'https://images.unsplash.com/photo-1554177352-aaf53e9b9b75?auto=format&fit=crop&w=400&q=80' },
  { id: 2, nama: 'Perpustakaan Digital', desc: 'Perpustakaan lengkap dengan koleksi buku dan akses digital', img: 'https://images.unsplash.com/photo-1507842725593-10390db7ee0b?auto=format&fit=crop&w=400&q=80' },
  { id: 3, nama: 'Lapangan Olahraga', desc: 'Lapangan olahraga lengkap untuk kegiatan ekstrakurikuler', img: 'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=400&q=80' }
]);

let pendaftar = loadStoredData('daftarSiswa', []);
let pesan = loadStoredData('daftarPesan', []);
let currentPage = 'dashboard';

if(localStorage.getItem('loginAdmin') !== 'true') {
  window.location.href = 'index.html';
}

// Navigasi Menu
const menuItems = document.querySelectorAll('.menu-item');
menuItems.forEach(item => {
  item.addEventListener('click', function() {
    const page = this.dataset.page;
    if(!page) return;
    currentPage = page;
    setActiveMenu(page);
    renderPage(page);
  });
});

function setActiveMenu(page) {
  menuItems.forEach(item => item.classList.toggle('active', item.dataset.page === page));
}

function navigateToPage(page) {
  currentPage = page;
  setActiveMenu(page);
  renderPage(page);
}

function saveLocal(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function refreshPage() {
  const active = document.querySelector('.menu-item.active');
  const page = active ? active.dataset.page : 'dashboard';
  currentPage = page;
  renderPage(page);
}

// Render Halaman
function renderPage(page) {
  const mainContent = document.getElementById('mainContent');
  
  switch(page) {
    case 'dashboard':
      mainContent.innerHTML = renderDashboard();
      break;
    case 'berita':
      mainContent.innerHTML = renderBerita();
      break;
    case 'galeri':
      mainContent.innerHTML = renderGaleri();
      break;
    case 'guru':
      mainContent.innerHTML = renderGuru();
      break;
    case 'fasilitas':
      mainContent.innerHTML = renderFasilitas();
      break;
    case 'statistik':
      mainContent.innerHTML = renderStatistik();
      break;
    case 'peserta':
      mainContent.innerHTML = renderPeserta();
      break;
    case 'pesan':
      mainContent.innerHTML = renderPesan();
      break;
    default:
      mainContent.innerHTML = renderDashboard();
      page = 'dashboard';
  }
  
  setActiveMenu(page);
  currentPage = page;

  // After render hooks
  if(page === 'statistik'){
    const cfg = JSON.parse(localStorage.getItem('siteConfig')) || {};
    if(cfg.stats){
      document.getElementById('statSiswa').value = cfg.stats.siswa || '';
      document.getElementById('statGuru').value = cfg.stats.guru || '';
      document.getElementById('statPrestasi').value = cfg.stats.prestasi || '';
    }
    if(document.getElementById('siteMapEmbed')){
      document.getElementById('siteMapEmbed').value = cfg.mapEmbed || '';
    }
  }
}

// Halaman Dashboard
function renderDashboard() {
  return `
    <h2>Dashboard</h2>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-top:20px;">
      <div class="card">
        <i class="fas fa-newspaper" style="font-size:2rem; color:var(--accent);"></i>
        <h3 style="margin-top:10px;">${berita.length}</h3>
        <p>Total Berita</p>
      </div>
      <div class="card">
        <i class="fas fa-images" style="font-size:2rem; color:var(--accent);"></i>
        <h3 style="margin-top:10px;">${galeri.length}</h3>
        <p>Total Foto Galeri</p>
      </div>
      <div class="card">
        <i class="fas fa-chalkboard-teacher" style="font-size:2rem; color:var(--accent);"></i>
        <h3 style="margin-top:10px;">${guru.length}</h3>
        <p>Total Guru</p>
      </div>
      <div class="card">
        <i class="fas fa-building" style="font-size:2rem; color:var(--accent);"></i>
        <h3 style="margin-top:10px;">${fasilitas.length}</h3>
        <p>Total Fasilitas</p>
      </div>
      <div class="card">
        <i class="fas fa-users" style="font-size:2rem; color:var(--accent);"></i>
        <h3 style="margin-top:10px;">${pendaftar.length}</h3>
        <p>Pendaftar Baru</p>
      </div>
      <div class="card">
        <i class="fas fa-envelope" style="font-size:2rem; color:var(--accent);"></i>
        <h3 style="margin-top:10px;">${pesan.length}</h3>
        <p>Pesan Masuk</p>
      </div>
    </div>
  `;
}

// Halaman Berita
function renderBerita() {
  let html = `
    <div class="card">
      <div class="card-header">
        <h2>Kelola Berita</h2>
        <button class="btn btn-primary" onclick="showFormBerita()"><i class="fas fa-plus"></i> Tambah Berita</button>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>No</th><th>Judul</th><th>Gambar</th><th>Tanggal</th><th>Deskripsi</th><th>Aksi</th></tr>
        </thead>
        <tbody>
  `;
  
  if(berita.length === 0) {
    html += `<tr><td colspan="6" style="text-align:center;">Belum ada berita</td></tr>`;
  } else {
    berita.forEach((b, index) => {
      html += `
        <tr>
          <td>${index + 1}</td>
          <td>${b.title}</td>
          <td><img src="${b.img || 'https://via.placeholder.com/80?text=No+Img'}" style="width:80px; height:50px; object-fit:cover; border-radius:8px;" alt="Foto"></td>
          <td>${b.date}</td>
          <td>${b.desc.substring(0, 50)}...</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="editBerita(${index})"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger" onclick="deleteBerita(${index})"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      `;
    });
  }
  
  html += `</tbody></table></div>`;
  return html;
}

// Form Berita
function showFormBerita(index = null) {
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  
  const data = index !== null ? berita[index] : { title: '', date: '', desc: '', img: '' };
  const title = index !== null ? 'Edit Berita' : 'Tambah Berita';
  
  modalTitle.innerText = title;
  modalBody.innerHTML = `
    <form id="formBerita">
      <div class="form-group">
        <label>Judul Berita</label>
        <input type="text" id="beritaTitle" class="form-control" value="${data.title}" required>
      </div>
      <div class="form-group">
        <label>Tanggal</label>
        <input type="text" id="beritaDate" class="form-control" value="${data.date}" placeholder="15 Jan 2024" required>
      </div>
      <div class="form-group">
        <label>Deskripsi</label>
        <textarea id="beritaDesc" class="form-control" required>${data.desc}</textarea>
      </div>
      <div class="form-group">
        <label>Upload Gambar</label>
        <input type="file" id="beritaImageFile" class="form-control" accept="image/*">
      </div>
      <div class="form-group">
        <label>Atau Gambar (URL)</label>
        <input type="text" id="beritaImg" class="form-control" value="${data.img}" placeholder="https://...">
        <p style="font-size:0.85rem; color:var(--text-light);">Pilih file dari desktop atau gunakan URL gambar.</p>
      </div>
      ${data.img ? `<div class="form-group"><label>Preview</label><img src="${data.img}" style="width:100%; border-radius:12px; margin-top:10px;" alt="Preview"></div>` : ''}
      <button type="submit" class="btn btn-primary" style="width:100%;">Simpan</button>
    </form>
  `;
  
  modal.classList.add('active');
  
  document.getElementById('formBerita').addEventListener('submit', (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('beritaImageFile');
    const urlInput = document.getElementById('beritaImg');
    const saveData = (imgSrc) => {
      const newData = {
        id: index !== null ? data.id : (berita.length ? Math.max(...berita.map(item => item.id)) + 1 : 1),
        title: document.getElementById('beritaTitle').value,
        date: document.getElementById('beritaDate').value,
        desc: document.getElementById('beritaDesc').value,
        img: imgSrc || urlInput.value.trim() || data.img || ''
      };
      if(index !== null) {
        berita[index] = newData;
      } else {
        berita.push(newData);
      }
      saveLocal('berita', berita);
      closeModal();
      refreshPage();
    };

    if(fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        saveData(evt.target.result);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else if(urlInput.value.trim() || data.img) {
      saveData();
    } else {
      alert('Silakan masukkan gambar dari file atau URL.');
    }
  });
}

function editBerita(index) {
  showFormBerita(index);
}

function deleteBerita(index) {
  if(confirm('Yakin hapus berita ini?')) {
    berita.splice(index, 1);
    saveLocal('berita', berita);
    refreshPage();
  }
}

// Halaman Galeri
function renderGaleri() {
  let html = `
    <div class="card">
      <div class="card-header">
        <h2>Kelola Galeri Foto</h2>
        <button class="btn btn-primary" onclick="showFormGaleri()"><i class="fas fa-plus"></i> Tambah Foto</button>
      </div>
      <div class="gallery-grid">
  `;
  
  if(galeri.length === 0) {
    html += `<p>Belum ada foto</p>`;
  } else {
    galeri.forEach((g, index) => {
      html += `
        <div class="gallery-item">
          <img src="${g}" alt="Foto">
          <div class="gallery-actions">
            <button class="btn btn-sm btn-primary" onclick="editGaleri(${index})"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger" onclick="deleteGaleri(${index})"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `;
    });
  }
  
  html += `</div></div>`;
  return html;
}

// Form Galeri
function showFormGaleri(index = null) {
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  
  let title = index !== null ? 'Edit Foto' : 'Tambah Foto';

      </div>
      <div class="form-group">
        <label>Atau Gambar (URL)</label>
        <input type="text" id="galeriUrl" class="form-control" placeholder="https://..." value="${index !== null ? galeri[index] : ''}">
      </div>
      ${index !== null ? `<div class="form-group"><label>Preview</label><img src="${galeri[index]}" style="width:100%; border-radius:8px; margin-top:10px;"></div>` : ''}
      <button type="submit" class="btn btn-primary" style="width:100%;">Simpan</button>
    </form>
  `;
  
  modal.classList.add('active');
  
  document.getElementById('formGaleri').addEventListener('submit', (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('galeriFile');
    const urlInput = document.getElementById('galeriUrl');
    const saveImage = (imgSrc) => {
      if(index !== null) {
        galeri[index] = imgSrc;
      } else {
        galeri.push(imgSrc);
      }
      saveLocal('galeri', galeri);
      closeModal();
      refreshPage();
    };

    if(fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        saveImage(evt.target.result);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else if(urlInput.value.trim()) {
      saveImage(urlInput.value.trim());
    } else if(index !== null) {
      saveImage(galeri[index]);
    } else {
      alert('Silakan pilih file atau masukkan URL gambar.');
    }
  });

function editGaleri(index) {

function deleteGaleri(index) {
